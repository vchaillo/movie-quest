<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101114"><title>Movie Quest — Your cinema. Your quest.</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#f6f4f0;background:#101114}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;padding:22px clamp(18px,5vw,80px);border-bottom:1px solid #292b31;gap:20px;flex-wrap:wrap}.brand{font-size:23px;font-weight:900;letter-spacing:-1px}.brand b{color:#edc76d}nav{display:flex;gap:8px;flex-wrap:wrap}nav button,.pill{background:none;border:1px solid #393b42;color:#ddd;padding:10px 15px;border-radius:40px}nav button.active,.pill.active{background:#edc76d;color:#111;border-color:#edc76d}main{max-width:1450px;margin:auto;padding:36px clamp(18px,5vw,70px)}.hero{padding:clamp(28px,5vw,70px);border:1px solid #333;border-radius:24px;background:radial-gradient(circle at 85% 15%,#4a3529,transparent 50%),linear-gradient(120deg,#24232a,#131418);margin-bottom:35px}.eyebrow{color:#edc76d;text-transform:uppercase;font-size:12px;letter-spacing:3px;font-weight:800}h1{font-size:clamp(38px,6vw,78px);line-height:1.05;letter-spacing:-3px;margin:15px 0}h2{font-size:28px;letter-spacing:-1px}p{color:#a8a9b1;line-height:1.65}.hero p{max-width:540px}.stats{display:flex;gap:35px;flex-wrap:wrap;margin-top:30px}.stats strong{font-size:27px;display:block}.stats span{color:#aaa;font-size:13px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}input,select{background:#202127;color:white;border:1px solid #3b3c42;padding:13px 16px;border-radius:12px;min-width:180px}input{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:17px}.card{background:#1b1c21;border:1px solid #303137;border-radius:16px;overflow:hidden;transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-4px);border-color:#edc76d}.poster{height:150px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#30323d,#27201c);font-size:55px;color:#eac877;font-weight:900}.content{padding:17px}.content h3{font-size:18px;margin:0 0 5px}.small{font-size:12px;color:#aaa}.films{color:#a6a6ac;font-size:13px;min-height:44px;margin:13px 0}.actions{display:flex;gap:8px}.actions button{flex:1;background:#2c2d34;border:0;border-radius:9px;color:white;padding:10px;font-size:12px}.actions button.primary{background:#edc76d;color:#111;font-weight:700}.panel{background:#1b1c21;border:1px solid #34353b;border-radius:16px;padding:25px;margin:18px 0}.filmrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #34353b}.filmrow span{flex:1}.filmrow button{border:1px solid #4a4b50;background:transparent;color:#eee;padding:8px 12px;border-radius:9px}.filmrow button.on{background:#edc76d;color:#111}.back{border:0;background:transparent;color:#edc76d;padding:0;margin-bottom:16px}footer{padding:35px;text-align:center;color:#777;font-size:12px}a{color:#edc76d}@media(max-width:600px){nav{width:100%;overflow:auto;flex-wrap:nowrap}nav button{white-space:nowrap}.stats{gap:22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.poster{height:110px}.content{padding:12px}.actions{flex-direction:column}.films{font-size:12px}}</style></head><body><header><div class="brand">MOVIE <b>QUEST</b></div><nav><button data-tab="discover" class="active">Découvrir</button><button data-tab="following">Mes personnalités</button><button data-tab="watchlist">À voir</button><button data-tab="seen">Films vus</button></nav></header><main id="app"></main><footer>MOVIE QUEST · Prototype · Données de démonstration · Sauvegarde locale</footer><script>
const people=[{"id":1,"name":"Christopher Nolan","role":"director","films":["Inception","Interstellar","Oppenheimer","The Dark Knight"]},{"id":2,"name":"Denis Villeneuve","role":"director","films":["Arrival","Dune","Prisoners","Blade Runner 2049"]},{"id":3,"name":"Martin Scorsese","role":"director","films":["Goodfellas","Taxi Driver","The Departed","Killers of the Flower Moon"]},{"id":4,"name":"Quentin Tarantino","role":"director","films":["Pulp Fiction","Kill Bill","Django Unchained","Once Upon a Time in Hollywood"]},{"id":5,"name":"David Fincher","role":"director","films":["Fight Club","Se7en","Gone Girl","The Social Network"]},{"id":6,"name":"Steven Spielberg","role":"director","films":["Jaws","Jurassic Park","E.T.","Schindler's List"]},{"id":7,"name":"Wes Anderson","role":"director","films":["The Grand Budapest Hotel","Moonrise Kingdom","Asteroid City"]},{"id":8,"name":"Greta Gerwig","role":"director","films":["Lady Bird","Little Women","Barbie"]},{"id":9,"name":"Sofia Coppola","role":"director","films":["Lost in Translation","Marie Antoinette","Priscilla"]},{"id":10,"name":"Bong Joon-ho","role":"director","films":["Parasite","Memories of Murder","Snowpiercer"]},{"id":11,"name":"Park Chan-wook","role":"director","films":["Oldboy","The Handmaiden","Decision to Leave"]},{"id":12,"name":"Hayao Miyazaki","role":"director","films":["Spirited Away","Princess Mononoke","My Neighbor Totoro"]},{"id":13,"name":"Ridley Scott","role":"director","films":["Alien","Blade Runner","Gladiator"]},{"id":14,"name":"James Cameron","role":"director","films":["Titanic","Avatar","The Terminator"]},{"id":15,"name":"Alfonso Cuarón","role":"director","films":["Roma","Gravity","Children of Men"]},{"id":16,"name":"Guillermo del Toro","role":"director","films":["Pan's Labyrinth","The Shape of Water","Pinocchio"]},{"id":17,"name":"Paul Thomas Anderson","role":"director","films":["There Will Be Blood","Phantom Thread","Licorice Pizza"]},{"id":18,"name":"Stanley Kubrick","role":"director","films":["2001: A Space Odyssey","The Shining","A Clockwork Orange"]},{"id":19,"name":"Akira Kurosawa","role":"director","films":["Seven Samurai","Rashomon","Ran"]},{"id":20,"name":"David Lynch","role":"director","films":["Mulholland Drive","Blue Velvet","The Elephant Man"]},{"id":21,"name":"Pedro Almodóvar","role":"director","films":["Talk to Her","Pain and Glory","Volver"]},{"id":22,"name":"Céline Sciamma","role":"director","films":["Portrait of a Lady on Fire","Petite Maman","Girlhood"]},{"id":23,"name":"Yorgos Lanthimos","role":"director","films":["The Favourite","Poor Things","The Lobster"]},{"id":24,"name":"Damien Chazelle","role":"director","films":["Whiplash","La La Land","Babylon"]},{"id":25,"name":"Christopher McQuarrie","role":"director","films":["Mission: Impossible - Fallout","Mission: Impossible - Rogue Nation"]},{"id":26,"name":"Leonardo DiCaprio","role":"actor","films":["Titanic","Inception","The Revenant","The Wolf of Wall Street"]},{"id":27,"name":"Cillian Murphy","role":"actor","films":["Oppenheimer","28 Days Later","Peaky Blinders"]},{"id":28,"name":"Florence Pugh","role":"actor","films":["Midsommar","Little Women","Oppenheimer"]},{"id":29,"name":"Emma Stone","role":"actor","films":["La La Land","Poor Things","The Favourite"]},{"id":30,"name":"Margot Robbie","role":"actor","films":["Barbie","I, Tonya","The Wolf of Wall Street"]},{"id":31,"name":"Ryan Gosling","role":"actor","films":["Drive","La La Land","Blade Runner 2049"]},{"id":32,"name":"Timothée Chalamet","role":"actor","films":["Dune","Call Me by Your Name","Wonka"]},{"id":33,"name":"Zendaya","role":"actor","films":["Dune","Challengers","Spider-Man: No Way Home"]},{"id":34,"name":"Robert Pattinson","role":"actor","films":["The Batman","The Lighthouse","Good Time"]},{"id":35,"name":"Tilda Swinton","role":"actor","films":["Only Lovers Left Alive","We Need to Talk About Kevin","The Grand Budapest Hotel"]},{"id":36,"name":"Cate Blanchett","role":"actor","films":["Tár","Carol","Blue Jasmine"]},{"id":37,"name":"Joaquin Phoenix","role":"actor","films":["Joker","Her","The Master"]},{"id":38,"name":"Christian Bale","role":"actor","films":["The Dark Knight","American Psycho","The Prestige"]},{"id":39,"name":"Natalie Portman","role":"actor","films":["Black Swan","Jackie","V for Vendetta"]},{"id":40,"name":"Saoirse Ronan","role":"actor","films":["Lady Bird","Brooklyn","Little Women"]},{"id":41,"name":"Daniel Day-Lewis","role":"actor","films":["There Will Be Blood","Lincoln","Phantom Thread"]},{"id":42,"name":"Brad Pitt","role":"actor","films":["Fight Club","Se7en","Once Upon a Time in Hollywood"]},{"id":43,"name":"Denzel Washington","role":"actor","films":["Training Day","Malcolm X","The Equalizer"]},{"id":44,"name":"Viola Davis","role":"actor","films":["Fences","The Woman King","Doubt"]},{"id":45,"name":"Meryl Streep","role":"actor","films":["The Devil Wears Prada","Sophie's Choice","The Iron Lady"]},{"id":46,"name":"Keanu Reeves","role":"actor","films":["The Matrix","John Wick","Speed"]},{"id":47,"name":"Tom Hanks","role":"actor","films":["Forrest Gump","Cast Away","Saving Private Ryan"]},{"id":48,"name":"Isabelle Huppert","role":"actor","films":["Elle","The Piano Teacher","Things to Come"]},{"id":49,"name":"Song Kang-ho","role":"actor","films":["Parasite","Memories of Murder","Broker"]},{"id":50,"name":"Tony Leung","role":"actor","films":["In the Mood for Love","Chungking Express","Infernal Affairs"]}];
let tab='discover',selected=null,search='',role='all';const state=JSON.parse(localStorage.getItem('moviequest-v1')||'{"following":[],"seen":[],"watchlist":[]}');const save=()=>localStorage.setItem('moviequest-v1',JSON.stringify(state));const key=(id,film)=>id+':'+film;const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toggle(type,value){state[type]=state[type].includes(value)?state[type].filter(v=>v!==value):[...state[type],value];if(type==='seen'&&state.seen.includes(value))state.watchlist=state.watchlist.filter(v=>v!==value);if(type==='watchlist'&&state.watchlist.includes(value))state.seen=state.seen.filter(v=>v!==value);save();render()}function card(p){const follow=state.following.includes(p.id);return '<article class="card"><div class="poster">'+escapeHtml(p.name.split(' ').map(x=>x[0]).slice(0,2).join(''))+'</div><div class="content"><h3>'+escapeHtml(p.name)+'</h3><div class="small">'+(p.role==='director'?'Réalisation':'Interprétation')+' · '+p.films.length+' films sélectionnés</div><div class="films">'+escapeHtml(p.films.slice(0,3).join(' · '))+'</div><div class="actions"><button class="primary" data-person="'+p.id+'">Filmographie →</button><button data-follow="'+p.id+'">'+(follow?'✓ Suivi':'+ Suivre')+'</button></div></div></article>'}function filmRow(p,f){const k=key(p.id,f);return '<div class="filmrow"><span>'+escapeHtml(f)+'</span><button class="'+(state.seen.includes(k)?'on':'')+'" data-film="'+encodeURIComponent(k)+'" data-type="seen">✓ Vu</button><button class="'+(state.watchlist.includes(k)?'on':'')+'" data-film="'+encodeURIComponent(k)+'" data-type="watchlist">＋ À voir</button></div>'}function render(){const app=document.getElementById('app');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(selected){const p=people.find(x=>x.id===selected);app.innerHTML='<button class="back" id="back">← Retour</button><div class="hero"><div class="eyebrow">'+(p.role==='director'?'Réalisateur':'Acteur / Actrice')+'</div><h1>'+escapeHtml(p.name)+'</h1><p>Explore sa sélection de films et avance dans ta quête cinéphile.</p><div class="stats"><div><strong>'+p.films.filter(f=>state.seen.includes(key(p.id,f))).length+' / '+p.films.length+'</strong><span>Films vus</span></div></div></div><h2>Filmographie (sélection)</h2><div class="panel">'+p.films.map(f=>filmRow(p,f)).join('')+'</div>';return}let list=people.filter(p=>(tab!=='following'||state.following.includes(p.id))&&(role==='all'||p.role===role)&&p.name.toLowerCase().includes(search.toLowerCase()));if(tab==='watchlist'||tab==='seen'){let type=tab;app.innerHTML='<div class="eyebrow">Ma collection</div><h1>'+(tab==='seen'?'Films vus':'Films à voir')+'</h1><div class="panel">'+people.flatMap(p=>p.films.filter(f=>state[type].includes(key(p.id,f))).map(f=>'<div><div class="small">'+escapeHtml(p.name)+'</div>'+filmRow(p,f)+'</div>')).join('')+'</div>';return}app.innerHTML='<section class="hero"><div class="eyebrow">Your cinema. Your quest.</div><h1>Chaque film<br>est une découverte.</h1><p>Suis les cinéastes et les acteurs qui t’inspirent. Explore leurs films, construis ta liste et vois jusqu’où ta quête t’emmène.</p><div class="stats"><div><strong>50</strong><span>Personnalités</span></div><div><strong>'+state.following.length+'</strong><span>Suivies</span></div><div><strong>'+state.seen.length+'</strong><span>Films vus</span></div><div><strong>'+state.watchlist.length+'</strong><span>À voir</span></div></div></section><h2>'+(tab==='following'?'Mes personnalités':'Explorer les personnalités')+'</h2><div class="toolbar"><input id="search" placeholder="Rechercher un acteur ou un réalisateur..." value="'+escapeHtml(search)+'"><select id="role"><option value="all">Tous les métiers</option><option value="director" '+(role==='director'?'selected':'')+'>Réalisateurs</option><option value="actor" '+(role==='actor'?'selected':'')+'>Acteurs et actrices</option></select></div><div class="grid">'+list.map(card).join('')+'</div>'+(list.length?'':'<p>Aucun résultat pour cette sélection.</p>')}document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;selected=null;search='';render()}if(t.dataset.follow)toggle('following',Number(t.dataset.follow));if(t.dataset.person){selected=Number(t.dataset.person);render()}if(t.dataset.film)toggle(t.dataset.type,decodeURIComponent(t.dataset.film));if(t.id==='back'){selected=null;render()}});document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;const pos=e.target.selectionStart;render();const i=document.getElementById('search');i.focus();i.setSelectionRange(pos,pos)}});document.addEventListener('change',e=>{if(e.target.id==='role'){role=e.target.value;render()}});render();
</script></body></html>
